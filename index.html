
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dhanush AI</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#0b0b0f;color:#fff;
 font-family:Arial,sans-serif;height:100dvh;
 display:flex;flex-direction:column
}
header{
 padding:18px;background:#15151d;border-bottom:1px solid #292934;
 display:flex;align-items:center;gap:12px
}
.logo{
 width:42px;height:42px;border-radius:50%;
 background:#6c5ce7;display:grid;place-items:center;font-size:22px
}
header h2{margin:0;font-size:18px}
header small{color:#aaa}
#chat{
 flex:1;overflow-y:auto;padding:16px;
 display:flex;flex-direction:column;gap:14px
}
.msg{
 max-width:88%;padding:12px 15px;border-radius:16px;
 white-space:pre-wrap;line-height:1.5;word-wrap:break-word
}
.user{align-self:flex-end;background:#6554d9}
.ai{align-self:flex-start;background:#20212a}
#status{font-size:12px;color:#aaa;padding:4px 16px}
footer{padding:12px;background:#15151d}
.controls{display:flex;gap:8px}
input{
 flex:1;min-width:0;background:#24242e;color:white;
 border:1px solid #393945;border-radius:24px;padding:14px;
 outline:none;font-size:16px
}
button{
 background:#6554d9;color:white;border:0;border-radius:50%;
 width:48px;height:48px;font-size:18px
}
button:disabled{opacity:.5}
.note{text-align:center;font-size:11px;color:#777;padding:8px}
</style>
</head>
<body>
<header>
 <div class="logo">🤖</div>
 <div>
  <h2>Dhanush AI</h2>
  <small>Your personal AI assistant</small>
 </div>
</header>

<div id="chat">
 <div class="msg ai">Hello! I'm Dhanush AI 🤖
How can I help you today?</div>
</div>

<div id="status"></div>

<footer>
 <div class="controls">
  <button id="mic" title="Voice input">🎤</button>
  <input id="message" placeholder="Ask Dhanush AI..." autocomplete="off">
  <button id="send" title="Send">➤</button>
  <button id="voice" title="Voice replies">🔊</button>
 </div>
 <div class="note">Dhanush AI can make mistakes. Verify important information.</div>
</footer>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbwUVfRj4KHA4LP6-Pr9rzX91HrAffl-W9AeK9SPt9stm6dUPe25U3RbLlbxT5GGz2WJ/exec";

const chat = document.getElementById("chat");
const input = document.getElementById("message");
const send = document.getElementById("send");
const statusBox = document.getElementById("status");
const voiceBtn = document.getElementById("voice");
const micBtn = document.getElementById("mic");
let voiceReplies = false;

function addMessage(text, type){
 const div = document.createElement("div");
 div.className = "msg " + type;
 div.textContent = text;
 chat.appendChild(div);
 chat.scrollTop = chat.scrollHeight;
 return div;
}

async function sendMessage(){
 const message = input.value.trim();
 if(!message || send.disabled) return;

 addMessage(message,"user");
 input.value = "";
 send.disabled = true;
 statusBox.textContent = "Dhanush AI is thinking...";

 try{
  const response = await fetch(API_URL,{
   method:"POST",
   headers:{"Content-Type":"text/plain;charset=utf-8"},
   body:JSON.stringify({message:message})
  });

  const data = await response.json();
  if(data.reply){
   addMessage(data.reply,"ai");
   if(voiceReplies) speak(data.reply);
  }else{
   addMessage(data.error || "No reply received.","ai");
  }
 }catch(error){
  addMessage("Connection error. The backend may need a CORS-compatible connection setup. Please try again.","ai");
 }
 statusBox.textContent = "";
 send.disabled = false;
 input.focus();
}

function speak(text){
 if(!("speechSynthesis" in window)) return;
 speechSynthesis.cancel();
 const utterance = new SpeechSynthesisUtterance(text);
 utterance.lang = "en-IN";
 speechSynthesis.speak(utterance);
}

send.addEventListener("click",sendMessage);
input.addEventListener("keydown",e=>{
 if(e.key==="Enter") sendMessage();
});

voiceBtn.addEventListener("click",()=>{
 voiceReplies=!voiceReplies;
 voiceBtn.textContent=voiceReplies?"🔊":"🔇";
 if(!voiceReplies) speechSynthesis.cancel();
});

micBtn.addEventListener("click",()=>{
 const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!SpeechRecognition){
  addMessage("Voice input is not supported in this browser.","ai");
  return;
 }
 const recognition=new SpeechRecognition();
 recognition.lang="en-IN";
 recognition.onresult=e=>{
  input.value=e.results[0][0].transcript;
  sendMessage();
 };
 recognition.onerror=()=>statusBox.textContent="Microphone error.";
 recognition.start();
 statusBox.textContent="Listening...";
});
</script>
</body>
</html>
