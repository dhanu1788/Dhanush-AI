
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dhanush AI</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#0b0b0f;color:white;font-family:Arial;
 height:100dvh;display:flex;flex-direction:column
}
header{
 padding:16px;background:#15151d;border-bottom:1px solid #292934;
 display:flex;align-items:center;gap:12px
}
.logo{
 width:42px;height:42px;border-radius:50%;background:#6c5ce7;
 display:grid;place-items:center;font-size:22px
}
h2{margin:0;font-size:19px}
small{color:#aaa}
#chat{
 flex:1;overflow-y:auto;padding:16px;
 display:flex;flex-direction:column;gap:14px
}
.msg{
 max-width:88%;padding:12px 15px;border-radius:16px;
 white-space:pre-wrap;line-height:1.5;overflow-wrap:anywhere
}
.user{align-self:flex-end;background:#6554d9}
.ai{align-self:flex-start;background:#20212a}
#status{font-size:12px;color:#aaa;padding:4px 16px}
footer{padding:12px;background:#15151d}
.controls{display:flex;gap:8px}
input{
 flex:1;min-width:0;background:#24242e;color:white;
 border:1px solid #393945;border-radius:24px;padding:14px;font-size:16px
}
button{
 background:#6554d9;color:white;border:0;border-radius:50%;
 width:46px;height:46px;font-size:18px
}
.note{text-align:center;font-size:11px;color:#777;padding:8px}
</style>
</head>
<body>

<header>
 <div class="logo">🤖</div>
 <div>
  <h2>Dhanush AI</h2>
  <small>Your personal AI assistant</small>
 </div>
</header>

<div id="chat">
 <div class="msg ai">Hello! I'm Dhanush AI 🤖
How can I help you today?</div>
</div>

<div id="status"></div>

<footer>
 <div class="controls">
  <button id="mic" title="Voice input">🎤</button>
  <input id="message" placeholder="Ask Dhanush AI..." autocomplete="off">
  <button id="send" title="Send">➤</button>
  <button id="voice" title="Voice replies">🔊</button>
 </div>
 <div class="note">AI can make mistakes. Verify important information.</div>
</footer>

<script>
const API_URL="https://script.google.com/macros/s/AKfycbwUVfRj4KHA4LP6-Pr9rzX91HrAffl-W9AeK9SPt9stm6dUPe25U3RbLlbxT5GGz2WJ/exec";

const chat=document.getElementById("chat");
const input=document.getElementById("message");
const send=document.getElementById("send");
const statusBox=document.getElementById("status");
const micBtn=document.getElementById("mic");
const voiceBtn=document.getElementById("voice");
let voiceReplies=false;

function addMessage(text,type){
 const d=document.createElement("div");
 d.className="msg "+type;
 d.textContent=text;
 chat.appendChild(d);
 chat.scrollTop=chat.scrollHeight;
}

function speak(text){
 if(!window.speechSynthesis)return;
 speechSynthesis.cancel();
 const u=new SpeechSynthesisUtterance(text);
 u.lang="en-IN";
 speechSynthesis.speak(u);
}

function askBackend(message){
 return new Promise((resolve,reject)=>{
  const callbackName="dhanushCallback";
  const script=document.createElement("script");
  const timer=setTimeout(()=>{
   cleanup();
   reject(new Error("timeout"));
  },45000);

  function cleanup(){
   clearTimeout(timer);
   script.remove();
   delete window[callbackName];
  }

  window[callbackName]=data=>{
   cleanup();
   resolve(data);
  };

  script.onerror=()=>{
   cleanup();
   reject(new Error("connection"));
  };

  script.src=API_URL+"?callback="+callbackName+
   "&message="+encodeURIComponent(message);

  document.body.appendChild(script);
 });
}

async function sendMessage(){
 const message=input.value.trim();
 if(!message||send.disabled)return;

 addMessage(message,"user");
 input.value="";
 send.disabled=true;
 statusBox.textContent="Dhanush AI is thinking...";

 try{
  const data=await askBackend(message);
  if(data.reply){
   addMessage(data.reply,"ai");
   if(voiceReplies)speak(data.reply);
  }else{
   addMessage(data.error||"No reply received.","ai");
  }
 }catch(error){
  addMessage("Connection failed. Please try again.","ai");
 }

 statusBox.textContent="";
 send.disabled=false;
 input.focus();
}

send.onclick=sendMessage;
input.onkeydown=e=>{
 if(e.key==="Enter")sendMessage();
};

voiceBtn.onclick=()=>{
 voiceReplies=!voiceReplies;
 voiceBtn.textContent=voiceReplies?"🔊":"🔇";
 if(!voiceReplies&&window.speechSynthesis)
  speechSynthesis.cancel();
};

micBtn.onclick=()=>{
 const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!SR){
  addMessage("Voice input isn't supported in this browser.","ai");
  return;
 }
 const r=new SR();
 r.lang="en-IN";
 r.onresult=e=>{
  input.value=e.results[0][0].transcript;
  sendMessage();
 };
 r.onerror=()=>{
  statusBox.textContent="Microphone error.";
 };
 r.onend=()=>{
  statusBox.textContent="";
 };
 statusBox.textContent="Listening...";
 r.start();
};
</script>
</body>
</html>
